; WHY NOT RUST: this is the player's settings file. It is plain text that people edit by hand.
;
; enshrouded-headroom settings.
; - A line that starts with ; or # is a comment.
; - Save this file as UTF-8, then restart the game.
; - Delete this file to get a new copy with the default values.
; - A value that is not valid is replaced by its default. A value that is out of range is moved
;   to the lowest or highest allowed value (TargetFps can also be 0, so any other value below
;   30 becomes 30). If LowerAbove is not above RaiseBelow, both go back to their defaults.
;   PaperWhiteNits is an exception: out-of-range values use game.
;   enshrouded-headroom.log lists every such value.

[General]
; Enabled: 1 = the mod works, 0 = the mod does nothing.
Enabled=1
; TextureBudget: auto = raise the game's texture budget to suit this GPU, off = leave it as it is,
; or a number of GiB from 2 to 8 to use that budget.
TextureBudget=auto
; TextureReserveGiB: VRAM (4 to 16 GiB) that "auto" keeps free for the rest of the game.
TextureReserveGiB=11
; AsyncCompute: on = turn async compute on, game = leave it to the game.
AsyncCompute=on
; Priority: above_normal = raise the process priority after renderer creation,
; normal = leave the current priority unchanged.
Priority=above_normal
; Reflex (NVIDIA, experimental): auto = on when supported, game = follow the saved menu value,
; off = disabled, on = enabled, boost = enabled with boost. Parsed only; not wired yet.
Reflex=auto
; AntiLag (experimental): auto = on for AMD when supported, off = disabled, on = enabled when
; supported. Parsed only; not wired yet. Not verified on AMD hardware.
AntiLag=auto
; AllowUnknownBuild: by default, after a game update the code patches stay off until the mod
; is updated. 1 = apply them anyway, at your own risk.
AllowUnknownBuild=0
; LogLevel: error, warn, info or debug.
LogLevel=info

[Governor]
; The governor raises draw distances while the game runs faster than the target, and lowers them
; again when it does not.
; TargetFps: 0 = governor off, or 30 to 360. The display refresh rate is the upper limit.
TargetFps=75
; WindowSeconds: how many seconds of frames are measured (0.5 to 10).
WindowSeconds=2
; RaiseBelow: raise a distance when the slow frames (95th percentile) take less than this
; share of the target frame time (0.5 to 0.99) ...
RaiseBelow=0.90
; RaiseHoldSeconds: ... for this many seconds (0.1 to 10).
RaiseHoldSeconds=1.0
; SettleSeconds: wait this long after a change before the next decision (0.1 to 10).
SettleSeconds=1.0
; LowerAbove: undo the last raise when the slow frames take more than this share of the
; target frame time (0.8 to 1.0). It must be higher than RaiseBelow ...
LowerAbove=0.97
; LowerHoldSeconds: ... for this many seconds (0.1 to 10).
LowerHoldSeconds=0.3
; HitchFactor: undo a raise at once if one frame just after it takes more than this many times
; the target frame time (1.2 to 5).
HitchFactor=2.0
; BlockSeconds: a raise that was undone is not tried again for this many seconds (1 to 300).
BlockSeconds=20
; MinVramFreeMiB: do not raise while less VRAM than this is free (0 to 8192).
MinVramFreeMiB=1024

[Knobs]
; Each distance has an Enable switch (1 or 0) and a Max step the governor may reach (0 to 4).
; Object draw distance.
EnableObjectDistance=1
MaxObjectDistance=4
; Grass and detail-scatter distance.
EnableScatterDistance=1
MaxScatterDistance=4
; Terrain detail distance.
EnableTerrainDistance=1
MaxTerrainDistance=4
; Start-up settings. They apply once, when the game starts. 1.0 = the game's own value.
; DecoDistanceScale and DistantObjectsScale: 0.5 to 1.0. A lower value should draw these farther
; (not yet confirmed in game).
DecoDistanceScale=1.0
DistantObjectsScale=1.0
; TerrainRingScale: 1.0 to 1.6. A higher value widens the terrain detail rings.
TerrainRingScale=1.0

[Hdr]
; PaperWhiteNits: game = keep the game's 250 nits, or a number from 40 to 400.
; An invalid or out-of-range value warns and uses game. Restart after changing it.
; The default stays game until the in-game HDR comparison.
PaperWhiteNits=game
