name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain (with clippy and rustfmt); rustup installs it here.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # The tests that read the real game exe or need an interactive desktop are #[ignore]d.
      - name: Test
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test 2>&1 | Tee-Object -Variable testOutput
          $testExitCode = $LASTEXITCODE
          $testSummary = @('```text') + @($testOutput | Where-Object { $_ -match '^test result:' }) + @('```')
          $testSummary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $testExitCode

      - name: Build the .asi
        run: cargo asi

      - uses: actions/upload-artifact@v4
        with:
          name: enshrouded-headroom-asi
          path: target/release/enshrouded-headroom.asi
