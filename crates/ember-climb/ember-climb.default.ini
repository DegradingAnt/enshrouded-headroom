; WHY NOT RUST: this is the player's settings file. It is plain text that people edit by hand.
;
; ember-climb settings.
; - A line that starts with ; or # is a comment.
; - Save this file as UTF-8, then restart the game.
; - Delete this file to get a new copy with the default values.
; - A value that is not valid is replaced by its default. A value that is out of range is moved
;   to the lowest or highest allowed value. ember-climb.log lists every such value.

[Climb]
; Enabled: 1 = climb any steep surface, 0 = the mod changes nothing.
Enabled=1
; SurfaceMask: which colliders can be climbed, as a sum of these bits.
;   0x4 = terrain and player walls, 0x20 = rock props, 0x100 = iron lattices, 0x8 = other solid
;   props such as trees. Only these bits are allowed.
SurfaceMask=0x124
; PlaneTolerance: how uneven (0.05 to 1 m) a patch of surface may be to start a climb.
PlaneTolerance=0.45
; StaminaMultiplier: climbing stamina cost (0 to 10), as a multiple of the game's cost.
; 1 uses the game's cost and hooks nothing. 0 makes climbing free.
StaminaMultiplier=1

[Start]
; What starts a climb. There is no button. Each key is 1 = on, 0 = off.
; Walk: walk into a steep surface.
Walk=1
; Jump: jump or fall into one.
Jump=1
; Sprint: sprint into one.
Sprint=1
; Glide: fly the glider into one. Experimental and off by default: it also changes how the game
; requests every climb. See the README before you turn it on.
Glide=0

[Tuning]
; WalkableAngle: a surface less steep than this (30 to 75 degrees) can be walked on. It starts
; no climb, and a climb can end on it.
WalkableAngle=50
; OverhangAngle: the farthest a face may hang over to start a climb (90 to 135 degrees, 90 is a
; sheer wall). A running climb gets 15 degrees more.
OverhangAngle=110
; EntryReach: how close (0.6 to 1.4 m) the player must be to a surface to start a climb.
EntryReach=0.95
; HoldReach: how far (0.8 to 1.6 m) the player looks for the surface during a climb. Under an
; overhang the player hangs farther out, and looks that much farther.
HoldReach=1
; GraceSeconds: reserved for a later seam-forgiveness feature (0 to 1 s).
; This test build keeps it unavailable. Nonzero values warn and stay inactive.
GraceSeconds=0

[Debug]
; Diagnostics: 1 = write one line a second to ember-climb.log while a climb runs, which shows
; which step failed, and one at most every 30 s when a surface was near and no climb started.
; 0 = quiet.
Diagnostics=1
