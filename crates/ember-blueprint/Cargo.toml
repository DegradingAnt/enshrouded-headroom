[package]
name = "ember-blueprint"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Validated blueprint interchange and transactional guide refresh for world holograms."

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
