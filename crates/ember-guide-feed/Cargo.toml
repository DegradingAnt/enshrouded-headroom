[package]
name = "ember-guide-feed"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Bounded background guide refresh using the existing blueprint session."

[dependencies]
ember-blueprint = { path = "../ember-blueprint" }
notify = { version = "=8.2.1", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
