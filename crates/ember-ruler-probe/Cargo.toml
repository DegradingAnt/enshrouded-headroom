[package]
name = "ember-ruler-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Opt-in, read-only native position calibration for the walking ruler."

[lib]
name = "ember_ruler_probe"
crate-type = ["cdylib", "rlib"]

[dependencies]
emberkit = { path = "../emberkit" }
log = "=0.4.34"
configparser = "=3.3.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
cc = "=1.10.0"

