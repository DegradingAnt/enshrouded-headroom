[package]
name = "enshrouded-headroom"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "ASI plugin for Enshrouded: texture budget, async compute, Reflex and an fps governor for draw distance."
license = "MIT"
publish = false

[lib]
name = "enshrouded_headroom"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
minhook = "=0.9.0"
ash = { version = "=0.38.0", default-features = false }
configparser = "=3.3.0"
log = "=0.4.34"
fern = "=0.7.1"

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std", "handle-panics"] }

[profile.release]
panic = "unwind"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = "line-tables-only"
